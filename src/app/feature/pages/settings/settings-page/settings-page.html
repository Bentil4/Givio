<section class="page" aria-labelledby="settings-title">
  <header class="page-head">
    <h1 id="settings-title" class="t-page-title">Settings</h1>
    <p class="t-secondary">Your own account details and how Givio looks for you.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Settings sections">
    @for (tab of tabs(); track tab.id; let i = $index) {
    <button
      #tabButton
      type="button"
      role="tab"
      class="tab"
      [id]="'settings-tab-' + tab.id"
      [class.is-active]="activeTab() === tab.id"
      [attr.aria-selected]="activeTab() === tab.id"
      [attr.aria-controls]="'settings-panel-' + tab.id"
      [attr.tabindex]="activeTab() === tab.id ? 0 : -1"
      (click)="selectTab(tab.id)"
      (keydown)="onTabKeydown($event, i)"
    >
      {{ tab.label }}
    </button>
    }
  </div>

  <div
    class="tab-panel"
    role="tabpanel"
    [id]="'settings-panel-' + activeTab()"
    [attr.aria-labelledby]="'settings-tab-' + activeTab()"
  >
    @switch (activeTab()) { @case ('profile') {
    <app-profile-settings />
    } @case ('company') {
    <app-company-settings />
    } @case ('appearance') {
    <app-appearance-settings />
    } }
  </div>
</section>
