<section class="page">
  <header class="page-head overview-head">
    <div>
      <h1 class="t-page-title">Overview</h1>
      <p class="t-secondary">Companies, approvals, people and support across the platform.</p>
    </div>
    <app-period-filter
      label="Time range for signups and approvals"
      [options]="periodOptions"
      [value]="period()"
      (valueChange)="choosePeriod($event)"
    />
  </header>

  <app-platform-kpis
    [tenants]="tenants()"
    [tenantsState]="tenantsState()"
    [window]="window()"
    [signupTrend]="signupsAndApprovals().signups"
    [pendingApprovals]="data.pendingApprovals()"
    [pendingApprovalsState]="data.pendingApprovalsState()"
    [openSupportRequests]="openSupportRequests()"
    [supportState]="supportState()"
  />

  <div class="chart-grid">
    <app-signups-approvals-chart
      [state]="tenantsState()"
      [labels]="bucketLabels()"
      [counts]="signupsAndApprovals()"
      (retry)="data.tenants.reload()"
    />
    <app-breakdown-chart
      title="Companies by status"
      subtitle="Every company, as it stands now"
      categoryHeading="Status"
      countHeading="Companies"
      errorText="Couldn't load companies."
      [horizontal]="true"
      [items]="statusCounts()"
      [state]="tenantsState()"
      (retry)="data.tenants.reload()"
    />
    <app-breakdown-chart
      title="Users by role"
      subtitle="Every account, as it stands now"
      kind="doughnut"
      categoryHeading="Role"
      countHeading="Users"
      errorText="Couldn't load users."
      emptyText="No user accounts yet."
      [items]="roleCounts()"
      [state]="usersState()"
      (retry)="data.users.reload()"
    />
    <app-breakdown-chart
      title="Companies by type"
      subtitle="What every company says it organises"
      categoryHeading="Type"
      countHeading="Companies"
      errorText="Couldn't load companies."
      emptyText="No companies yet."
      [items]="typeCounts()"
      [state]="tenantsState()"
      (retry)="data.tenants.reload()"
    />
    <app-approval-queue-panel
      [counts]="data.pendingApprovals()"
      [state]="data.pendingApprovalsState()"
    />
    <app-platform-activity-panel
      [entries]="activity()"
      [state]="activityState()"
      [usersById]="usersById()"
      (retry)="data.recentActivity.reload()"
    />
  </div>
</section>
