<main class="flex flex-col gap-lg p-xl">
  <div>
    <h1 class="font-display text-2xl font-bold text-primary-dark">Create Event</h1>
    <p class="font-body text-sm text-primary-mid">
      Set up a new Wedding or Funeral event's basic record
    </p>
  </div>

  @if (formError(); as error) {
  <div class="rounded-md border border-danger bg-bg-frost p-md font-body text-sm text-danger">
    {{ error }}
  </div>
  }

  <form
    class="flex w-full max-w-lg flex-col gap-md"
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
  >
    <app-input label="Event Name" formControlName="name" />

    <div class="flex flex-col gap-xs">
      <span class="form-label font-body text-sm font-medium text-primary-dark">Event Type</span>
      <div class="flex gap-lg">
        <app-radio label="Wedding" value="wedding" formControlName="type" />
        <app-radio label="Funeral" value="funeral" formControlName="type" />
      </div>
    </div>

    <app-input label="Date" type="date" formControlName="date" />
    <app-input label="Host / Family Name" formControlName="hostName" />
    <app-input label="Venue (optional)" formControlName="venue" />

    <div class="flex flex-col gap-xs">
      <label class="form-label font-body text-sm font-medium text-primary-dark" for="description">
        Description (optional)
      </label>
      <textarea
        id="description"
        class="w-full rounded-md border-[1.5px] border-data-1 bg-bg-white p-sm font-body text-[0.9rem] text-primary-dark outline-none focus:border-primary-deep"
        rows="3"
        formControlName="description"
      ></textarea>
    </div>

    <div class="flex flex-col gap-xs">
      <label class="form-label font-body text-sm font-medium text-primary-dark" for="notes">
        Notes (optional)
      </label>
      <textarea
        id="notes"
        class="w-full rounded-md border-[1.5px] border-data-1 bg-bg-white p-sm font-body text-[0.9rem] text-primary-dark outline-none focus:border-primary-deep"
        rows="3"
        formControlName="notes"
      ></textarea>
    </div>

    <div class="flex justify-end gap-sm">
      <app-button type="submit" variant="primary" [disabled]="form.invalid" [loading]="submitting()">
        Create Event
      </app-button>
    </div>
  </form>
</main>
