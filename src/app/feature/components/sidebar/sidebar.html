<aside class="sidebar" [class.collapsed]="collapsed()">
  <header class="sidebar-header">
    <img
      src="assets/images/Givio-logo.png"
      alt="Logo"
      class="logo"
    />
    <button
      type="button"
      class="collapse-toggle"
      (click)="toggleCollapsed.emit()"
      [attr.aria-label]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <mat-icon>{{ collapsed() ? 'chevron_right' : 'chevron_left' }}</mat-icon>
    </button>
  </header>

  <nav class="sidebar-nav" role="navigation">
    <ul class="nav-list">
      @for (item of navItems(); track item.name) {
      <li class="nav-item">
        @if (item.disabled) {
          <span
            class="nav-link is-disabled"
            aria-disabled="true"
            [matTooltip]="collapsed() ? item.name + ' — coming soon' : 'Coming soon'"
            matTooltipPosition="right"
          >
            <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
            <span class="nav-label">{{ item.name }}</span>
          </span>
        } @else {
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            class="nav-link"
            [matTooltip]="collapsed() ? item.name : ''"
            matTooltipPosition="right"
          >
            <mat-icon class="nav-icon">{{ item.icon }}</mat-icon>
            <span class="nav-label">{{ item.name }}</span>
          </a>
        }
      </li>
      }
    </ul>
  </nav>

  <footer class="sidebar-footer">
    <div class="notification">
      <mat-icon matBadge="15">notifications</mat-icon>
      <span class="status-indicator nav-label">online . 2min ago</span>
    </div>
    <div class="user-profile">
      <div class="user-initials">JD</div>
    </div>
    <button type="button" class="logout-button" (click)="logout.emit()">
      <mat-icon>logout</mat-icon>
      <span class="nav-label">Logout</span>
    </button>
  </footer>
</aside>
