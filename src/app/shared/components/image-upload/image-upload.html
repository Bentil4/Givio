<div class="image-upload-wrap">
  @if (label()) {
  <label class="form-label" [attr.for]="inputId()">{{ label() }}</label>
  }

  @if (value(); as src) {
  <div class="image-preview-row">
    <img [src]="src" alt="Preview" class="image-preview" />
    <button
      type="button"
      class="btn-remove"
      [disabled]="isDisabled()"
      [attr.aria-label]="label() ? 'Remove ' + label() : 'Remove image'"
      (click)="clear()"
    >
      Remove
    </button>
  </div>
  } @else {
  <input
    class="image-input"
    type="file"
    accept="image/*"
    [id]="inputId()"
    [disabled]="isDisabled()"
    (change)="onFileSelected($event)"
    (blur)="onTouched()"
  />
  }

  @if (localError() || error()) {
  <p class="field-error" role="alert">{{ localError() || errorMessage() }}</p>
  }
</div>
