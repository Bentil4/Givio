  # 3-6 implemented 2026-09-09: added a receipt-numbering scheme (AD-8) split across the client
  # and the Function. Client (src/app/data/models/receipt-numbering.ts): eventShortCode()
  # (type prefix + last 4 alnum chars of the event id) + provisionalReceiptNumber(), used by
  # DonationDataService.createDonation to assign a real `{shortCode}-P{n}` number up front
  # (replacing the old `P-${Date.now()...}` placeholder) — `n` is a device-local count of this
  # event's still-provisional receipts, so two offline donations on the same device never
  # collide, and a retired (already-synced) slot is safe to reuse. Server
  # (donation-recording.js): the Function is now the sole assigner of the canonical number —
  # atomically increments the Event's own `nextReceiptSeq` column (tablesDB.incrementRowColumn)
  # and writes `{eventShortCode}-{seq}` into the Donation row, ignoring the client-sent
  # provisional value for the actual write. DonationDataService.trySyncNow reads the Function's
  # response and overwrites the local record's receiptNumber with that canonical value —
  # nothing already printed needs reprinting, only the stored value changes, whether the sync
  # happens inline (online) or later via SyncEngineService's retry (was offline). The
  # eventShortCode logic is duplicated by hand between the TS model and the plain-JS Function
  # (no shared module system between the two deployments), same convention as shared.js's
  # VALID_ROLES/auth.service.ts note.
  # New ReceiptService (src/app/data/services/receipt.service.ts) generates the print-ready A5
  # PDF client-side via jsPDF (npm-installed per the architecture doc, not vendored like
  # SheetJS) — Event Name (prominent) + Type, a dividing line, a "PROVISIONAL" marker whenever
  # syncStatus isn't yet 'synced', Donor/Amount/Type/On-Behalf-Of/Date-Time/Receipt No/Operator
  # rows, and a thank-you message. downloadReceipt() saves as
  # `Receipt_[EventName]_[ReceiptNo].pdf`; printReceipt() opens the same PDF in a new tab with
  # autoPrint() set, no server round-trip either way. Wired into donation-entry.ts's 'saved'
  # phase, whose "Print receipt"/"Download PDF" buttons had been sitting unwired since Story 3.1.
  # Known gap (out of scope for this story): mobile-entry.ts has no post-save confirmation
  # screen at all (it resets immediately for the next donor, by design — see its own doc
  # comment), so this form factor has no receipt UI yet. The donation itself still gets a
  # correct receiptNumber either way (that path is shared), only the print/download affordance
  # is desk-only for now.
  # Deployed via the Appwrite MCP server same-day (same flow as Stories 2.2/2.4/3.5): pushed
  # this branch, VCS auto-built deployment 6aa1292302b989d312f6 in 22s, then explicitly
