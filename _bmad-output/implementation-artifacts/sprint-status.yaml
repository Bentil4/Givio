  # 240px sidebar just squeezed page content into an unusably narrow column below ~720px. Added
  # a hamburger toggle + off-canvas drawer to Sidebar (mobileOpen input/dismissMobile output,
  # accessible via a real (keydown.escape) handler per WCAG 2.1.1, same justified
  # eslint-disable-next-line pattern as the modal-scrim fix from the CI/lint cleanup) plus
  # wiring in both layouts. The desktop icon-only collapse feature is untouched/independent —
  # CSS resets it inside the mobile breakpoint since that trade-off doesn't apply to an overlay.
  # Table overflow (AC1): admin-users/admin-trash/admin-events all reuse admin-donations' table
  # markup but — being separate Angular components — never actually got its scoped .table-wrap/
  # .table CSS (including the overflow-x:auto the fix depends on). Promoted the whole block to
  # global styles.scss, single source of truth now.
  # Systematic audit (AC1): 27 component stylesheets had zero @media queries. Delegated a
  # thorough read of the .scss+.html pairs to background agents to separate genuine overflow/
  # touch-target risk from files that just happen to already be fluid; fixed every confirmed
  # finding: donation-form's .field-row (no min-width:0, native inputs' intrinsic width can't
  # shrink) and its .btn-save/.btn-clear (referenced but never defined anywhere — silently
  # unstyled, sub-20px buttons; switched to the real .btn/.btn-primary/.btn-secondary classes,
  # restoring what the file's own comment already claimed was true), admin-donations' .page-head
  # (no flex-wrap, title+total+actions row overflows ~344px vs ~312px available at 360px) and
  # its .field-row (same min-width:0 gap, and — since admin-events/admin-trash/admin-users/
  # admin-event-detail/edit-event all `@use` admin-donations.scss directly — this one fix
  # propagates to all five consuming screens for free), mobile-entry's .amount-value (fixed
  # 2.5rem risks overflowing 360px for a real 5-6-digit amount; switched to a clamp() that
  # shrinks instead of clipping an actual money value), checkbox/filter-tags (same missing
  # min-height:44px .form-row pattern as radio/toggle, plus filter-tags needed flex-wrap so a
