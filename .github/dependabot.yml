version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      # Angular packages (and everything peer-locked to Angular's version: primeng,
      # @ng-icons, angular-eslint, and the typescript/typescript-eslint range that
      # @angular/build pins) must move together — bumping any one alone breaks
      # npm ci with ERESOLVE.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'angular-eslint'
          - '@angular-eslint/*'
          - 'primeng'
          - '@ng-icons/*'
          - 'typescript'
          - 'typescript-eslint'
      # @vitest/coverage-v8 must match the vitest version @angular/build pins internally.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
    ignore:
      # @angular/build pins TypeScript to a narrow range (22.2 requires >=6.0 <6.1). Without
      # this, the angular group bundles a TypeScript major Angular can't build with, and every
      # group PR fails npm ci with ERESOLVE. Raise the bound when Angular widens its peer range.
      - dependency-name: 'typescript'
        versions: ['>=6.1']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'ci'
    groups:
      # init and analyze are two halves of one action and must share a version; bumping
      # either alone fails the CodeQL job.
      codeql-action:
        patterns:
          - 'github/codeql-action/*'
