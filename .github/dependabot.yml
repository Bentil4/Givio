version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    labels:
      - 'dependencies'
    groups:
      # Angular packages (and everything peer-locked to Angular's version: primeng,
      # @ng-icons, angular-eslint, and the typescript/typescript-eslint range that
      # @angular/build pins) must move together — bumping any one alone breaks
      # npm ci with ERESOLVE.
      angular:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'angular-eslint'
          - '@angular-eslint/*'
          - 'primeng'
          - '@ng-icons/*'
          - 'typescript'
          - 'typescript-eslint'
      # @vitest/coverage-v8 must match the vitest version @angular/build pins internally.
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
      - 'ci'
