name: Route Diagram

# main/dev are protected (PR-only + required "CI Gate"), so a regenerated diagram can't be pushed
# straight back. Instead it lands on a fixed per-base branch (chore/route-diagram-sync-<base>)
# with a single PR that every later run updates in place, or closes once the base is up to date.
#
# Loop safety: only pushes to main/dev trigger this workflow, never the sync branch. Merging the
# sync PR re-runs it (routes.mmd changed), but the regenerated file then equals the committed one,
# so no PR is opened and that run only pushes the now-final diagram to Mermaid.
on:
  push:
    branches: [main, dev]
    paths:
      - 'src/app/**/*.routes.ts'
      - 'docs/diagrams/**/*.mmd'
      - 'scripts/generate-route-diagram.mjs'
      - '.github/workflows/route-diagram.yaml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Only for the fallback below that dispatches CI on the sync branch.
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate route diagram
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MERMAID_CHART_AUTH_TOKEN: ${{ secrets.MERMAID_CHART_AUTH_TOKEN }}
      HAS_PR_TOKEN: ${{ secrets.ROUTE_DIAGRAM_PR_TOKEN != '' }}
      SYNC_BRANCH: chore/route-diagram-sync-${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate diagram
        run: npm run diagrams
      - name: Check for diagram changes
        id: diff
        run: |
          if git diff --quiet -- docs/diagrams/generated; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "Route diagram already up to date."
          else
            echo "stale=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- docs/diagrams/generated
          fi
      # Runs even when nothing changed: with delete-branch, an up-to-date base makes the action
      # delete the sync branch, which closes a now-redundant PR instead of leaving it stale.
      # PRs opened with GITHUB_TOKEN don't trigger other workflows, so CI Gate never reports on
      # them; a ROUTE_DIAGRAM_PR_TOKEN secret (fine-grained PAT) avoids that.
      - name: Open or update sync PR
        id: cpr
        if: ${{ github.ref_name == 'main' || github.ref_name == 'dev' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.ROUTE_DIAGRAM_PR_TOKEN || secrets.GITHUB_TOKEN }}
          base: ${{ github.ref_name }}
          branch: ${{ env.SYNC_BRANCH }}
          delete-branch: true
          add-paths: docs/diagrams/generated
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: 'docs(diagrams): regenerate route map'
          title: 'docs(diagrams): regenerate route map'
          body: |
            The route files on `${{ github.ref_name }}` changed, so `docs/diagrams/generated/routes.mmd` was regenerated by the Route Diagram workflow.

            This PR is updated in place on every later run and closed automatically once `${{ github.ref_name }}` is up to date. Merging it re-runs the workflow, which then pushes the final diagram to Mermaid.
      # workflow_dispatch is one of the few events GITHUB_TOKEN may trigger, and the resulting
      # CI Gate check run lands on the sync branch's head commit, which is the PR's head.
      - name: Run CI on sync PR (GITHUB_TOKEN fallback)
        if: >-
          ${{ env.HAS_PR_TOKEN != 'true' &&
          (steps.cpr.outputs.pull-request-operation == 'created' ||
          steps.cpr.outputs.pull-request-operation == 'updated') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run main.yaml --repo "$GITHUB_REPOSITORY" --ref "$SYNC_BRANCH"
      # Only files linked with `mermaidchart link` (an `id:` in their frontmatter) can be pushed.
      # A stale generated diagram isn't on the base branch yet; the run after its sync PR merges
      # pushes it, so here only the other linked diagrams go.
      - name: Push linked diagrams to Mermaid
        if: ${{ env.MERMAID_CHART_AUTH_TOKEN != '' }}
        env:
          STALE: ${{ steps.diff.outputs.stale }}
        run: |
          exclude=()
          if [ "$STALE" = "true" ]; then
            exclude=(--exclude-dir=generated)
          fi
          linked=$(grep -rlE '^id: ' docs/diagrams --include='*.mmd' "${exclude[@]}" || true)
          if [ -z "$linked" ]; then
            echo "No linked diagrams to push."
            exit 0
          fi
          npx -y @mermaidchart/cli push $linked
